# extending the Setup
masking:
  enabled: true # swithcer gloal masking
  mask_message: true # aktifkan masking di message
  mask_extra: true # aktifkan masking di extra
  default_mask: "XXXXXXXX"
  mask_regex:
    credit_card: "\\b\\d{4}[\\s-]?\\d{4}[\\s-]?\\d{4}[\\s-]?\\d{4}\\b"
    email: "\\b[\\w.-]+@[\\w.-]+\\.\\w+\\b"
    password: "(?i)password\\s*:\\s*\\S+"
    token: "(?i)token\\s*:\\s*\\S+"
  mask_fields: ["password", "token", "secret", "card"]

# propogate Handler Setup
propogate:
  enabled: true # swith global
  level_to_pass: "INFO"
  loggers_name:
    [
      "uvicorn",
      "uvicorn.access",
      "uvicorn.error",
      "fastapi",
      "asyncio",
      "starlette",
    ]

#TODO: Masalah Exception Nanti Pikirin Lagi , yang penting udah ada bayang bayang
exception_format:
  enabled: true
  use_stackprinter: true
  diagnose: true
traceback_format:
  enabled: true

# Loguru Default Config
handlers:
  # Handler utama untuk info/debug (tanpa traceback/stackprinter)
  - sink: ext://sys.stdout
    level: "DEBUG"
    format: "<level>{level: <8}</level>| <magenta>{name}</magenta>:<bold>{function}</bold>:<magenta>{line}</magenta> | <level>{message}</level> | <l>{extra}</>"
    enqueue: true
    diagnose: false
    backtrace: false
    # filter: "lambda record: record['level'].no < 40" # hanya untuk level < ERROR

  # Handler khusus untuk error/exception (dengan stackprinter/traceback)
  - sink: ext://sys.stderr
    level: "ERROR"
    # format: "<level>{level: <8}</level>| <magenta>{name}</magenta>:<bold>{function}</bold>:<magenta>{line}</magenta> | <level>{message}</level> | {extra[stack]}"
    format: "<level>{level: <8}</level>| <magenta>{name}</magenta>:<bold>{function}</bold>:<magenta>{line}</magenta> | <level>{message}</level>"
    enqueue: true
    diagnose: true
    backtrace: true
    # filter: "lambda record: record['level'].no >= 40" # hanya untuk level ERROR dan ke atas

extra:
  env: "override me please"

activation:
  - ["uvicorn.watchfiles", false]
  - ["watchfiles", false]
  - ["another_library.module", true]
